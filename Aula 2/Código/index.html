<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <img src="Senai.png" alt="Logo do Senai" class="logo"/>
      <h2>Cadastro de usuário</h2>
      <form id="cadastroForm">
        <input type="nome" id="nome" placeholder="Nome">
        <input type="email" id="email" placeholder="E-mail">
        <input type="senha" id="senha" placeholder="Senha">
        <button type="button" onclick="cadastrarUsuario()">Cadastrar</button>
      </form>
      <a href="usuarios.html" class="link-usuarios">Ver usuários cadastrados</a>
    </div>
    <div id="mensagem" class="mensagem oculto" onclick="fecharMensagem()"></div>
    <script src="script.js"></script>
  </body>
</html>
